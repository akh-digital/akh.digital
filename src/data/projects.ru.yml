# Expertise

expertise:
  title: Эксперт
  desc: |
    (1) Продуктовый дизайнер из Санкт-Петербурга. Создаю интерфейсы и цифровые продукты, в центре которых человек. Для меня цифровые продукты — это не просто строки кода: в них сочетаются эстетика, функциональность и бизнес-цели, с акцентом на потребности пользователей.
    (2) Проектирую продукты, бренды и цифровые сервисы от стратегии до реализации. В тесной работе с клиентами и стейкхолдерами превращаю бизнес-цели в продуманные дизайн-решения: от подготовки брифа и разработки концепций до доведённого до ума результата и сопровождения производства.
    (3) Работаю системно, используя дизайн как метод решения бизнес-задач. Считаю, что дизайн работает, когда он решает реальные проблемы, отвечает измеримым целям и совершенствуется от итерации к итерации. Каждый проект начинается с понимания контекста, а заканчивается осмысленным решением, отточенным и рассчитанным на долгий срок.
    (4) Как дизайн-лид, выстраиваю команды так же тщательно, как создаю продукты. Развиваю дизайн-процессы, налаживаю взаимодействие между разными направлениями и наставляю дизайнеров, помогая расти как отдельным специалистам, так и командам, при этом повышая общее качество дизайна.
