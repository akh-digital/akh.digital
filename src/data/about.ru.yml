about:
  title: Привет! 
  desc: |
    Родился в Таллине и вырос среди инженеров: в нашей семье все так или иначе связаны с железными дорогами и промышленным строительством. Изучал межкультурные коммуникации и романские языки в Санкт-Петербурге, что очень помогло мне в карьере дизайнера.
    В 2005 году начал работать графическим дизайнером и дизайнером упаковки в федеральной оптовой компании (ручной и электроинструмент для профессионального и бытового использования). За более чем 8 лет работы там успешно реализовал 100+ проектов по упаковке и полиграфии. Затем работал графическим дизайнером в Петербургском международном экономическом форуме, где создавал различные материалы для оформления помещений и открытых пространств, печатную продукцию и иллюстрации.
    С 2014 года активно работаю в IT-сфере: создаю дизайн-системы, ERP-системы, веб-заказы (Web-ordering), B2C веб-приложения, сайты и цифровые иллюстрации в Figma. Работал UI/UX-дизайнером и создавал цифровые решения для Siemens AG, Tassta GmbH, Alcon, Essilor, CooperVision и других компаний.
    Когда не занят дизайном, меня, скорее всего, можно найти на паддл-корте, за бильярдным столом с кием или на велосипеде. Увлекаюсь электронной музыкой: рейвы для меня — обычное дело, а крафтовые пивные бары — более спокойная альтернатива. Много готовлю и люблю котиков.

