about:
  title: Привет! Это я
  desc: |
    Я родился в Таллине и вырос среди инженеров: в нашей семье все так или иначе связаны с железными дорогами и промышленным строительством. Хотя я учился межкультурным коммуникациям и романским языкам в Санкт-Петербурге, по специальности я никогда не работал, но это образование очень помогло мне в карьере дизайнера.
    В 2005 году я начал свою первую работу графическим дизайнером и дизайнером упаковки в федеральной оптовой компании (ручной и электроинструмент для профессионального и бытового использования). За более чем 8 лет работы там я успешно реализовал свыше 100 проектов по упаковке и полиграфии. Затем я работал графическим дизайнером в Петербургском международном экономическом форуме, где создавал различные материалы для оформления помещений и открытых пространств, печатную продукцию и иллюстрации.
    С 2014 года я активно работаю в IT-сфере: создаю дизайн-системы, ERP-системы, веб-заказы (Web-ordering), B2C веб-приложения, сайты и цифровые иллюстрации в Figma. Я успешно работал UI/UX-дизайнером и создавал цифровые решения для Siemens AG, Tassta GmbH, Alcon, Essilor, CooperVision и других компаний.
    Когда я не занят дизайном, меня, скорее всего, можно найти на паддл-корте, за бильярдным столом с кием или на велосипеде. Я обожаю электронную музыку: рейвы для меня — обычное дело, а крафтовые пивные бары — более спокойная альтернатива. Я много готовлю и люблю котиков.

